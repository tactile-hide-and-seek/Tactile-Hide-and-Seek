dataset:
  name: TUM-ICS/Hide-and-Seek
  window_length: 100
  stride: 40
  batch_size: 32
  num_workers: 4
model:
  modalities: M123
  hidden_dim: 128
  num_heads: 4
  num_layers: 2
  dropout: 0.1
training:
  learning_rate: 0.0001
  weight_decay: 0.001
  epochs: 20
  output_dir: checkpoints
  seed: 42
