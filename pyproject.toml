[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "has-baselines"
version = "0.1.0"
description = "Offline dataset loading, baseline training, and evaluation for Tactile Hide and Seek."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "datasets>=2.18",
  "numpy>=1.24",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
  "torch>=2.0",
  "tqdm>=4.66"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
plots = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["has_dataset*", "models*", "scripts*"]
